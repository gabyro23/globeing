<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Globeing — Compare Countries</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="site-header__brand" href="#" aria-label="Globeing — home">
      <img class="site-header__logo" src="assets/logo.png" alt="Globeing" />
    </a>
    <nav class="site-header__nav" aria-label="Main navigation">
      <a href="#about">About us</a>
      <a href="#contact">Contact</a>
      <a href="#" class="site-header__cta">Download app</a>
    </nav>
  </header>

  <div class="app-header__intro">
    <p class="app-header__tagline">Compare countries by population and land area.</p>
    <span id="country-count-badge" class="app-header__stat" hidden></span>
  </div>

  <div id="status" class="status">
    <span class="status__spinner" aria-hidden="true"></span>
    <span>Loading data and map…</span>
  </div>

  <main class="app-layout">
    <aside class="app-layout__sidebar">
      <section id="filter-panel" aria-label="Filters"></section>
      <section id="country-list" class="app-layout__list" aria-label="Country list"></section>
    </aside>

    <section class="app-layout__map" aria-label="Interactive map">
      <div id="map-view"></div>
    </section>
  </main>

  <section id="compare-zone" class="app-layout__compare" aria-label="Country comparison"></section>

  <footer class="app-footer">
    <p>Population and land area data from public sources (static dataset). Base map: Natural Earth / world-atlas.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
